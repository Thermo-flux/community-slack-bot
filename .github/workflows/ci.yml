name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the package itself, so the build backend, the dependency list (PyYAML and the
      # tzdata that ZoneInfo needs on Windows and slim images) and both extras are exercised.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[slack,dev]"

      # The whole Definition of done, in order.
      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Level simulation
        run: python tools/level_sim.py

      - name: Check config
        run: python -m goose.gateway.app --check-config

      - name: No em or en dashes
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          skip = {".git", "data", "__pycache__", ".pytest_cache", ".ruff_cache"}
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or skip & set(path.parts) or path.suffix == ".pyc":
                  continue
              raw = path.read_bytes()
              if b"\x00" in raw:
                  continue
              text = raw.decode("utf-8", errors="ignore")
              if "\u2014" in text or "\u2013" in text:
                  bad.append(str(path))
          if bad:
              print("dashes found in:", *bad, sep="\n  ")
              sys.exit(1)
          print("no em or en dashes")
          PY
