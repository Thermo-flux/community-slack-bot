# goose-lee configuration. Validated on start; any typo or wrong type stops the bot (fail closed).
# Secrets are NOT here: they live in .env (gateway) and voice.env (voice).

channels:
  scored: ["C_LOADOUT"]          # channel ids the duck scores and answers in (the official #loadout channel)
  organizer: "C_ORGANIZERS"      # private channel for the Monday post and alerts (the bot must be invited)

people:
  organizers: []                 # Slack user ids of organizers (adults). At least 2 recommended
  owner: ""                      # Slack user id that can run confirm-final and set-end
  confirmations_required: 1      # 1 = one organizer confirms a week, 2 = two must

scoring:
  message_curve: log             # log = gentle curve (recommended), linear = pure volume
  hold_seconds: 600              # a new fact is pending this long before it counts
  min_words: 3
  min_chars: 12
  flood_seconds: 30
  star_points: 25
  bigstar_points: 60

levels:
  thresholds: [0, 10, 25, 50, 100, 155, 235, 330, 445, 580, 735, 890]
  growth_above_top: 1.2
  titles: [Hatchling, Duckling, Paddler, Dabbler, Mallard, Diver, Pond Scout, Flock Leader, Wing Commander, Golden Beak, Pond Elder, Head Duck]
  band_steady: 15
  band_active: 50
  band_very_active: 100

vibes:
  bot_name: goose-lee
  mascot: duck
  humor_level: 2                 # 1 = Orry's level, 2 = the duck, 3 = off until after the shadow weeks
  german_rate: 0.25              # about one reply in four may carry an approved German phrase
  german_gloss: on_request       # on_request | first_time | always
  roast_rate: 0.1                # light roasts, rare, templates only
  newcomer_days: 14
  reactions_per_hour: 6
  reaction_person_gap_s: 600
  name_reaction_chance: 0.33

voice:
  enabled: false                 # stays OFF until the gates in docs/PLAN.md (section 15) are met
  url: "http://voice:8081"
  secret_env: VOICE_SHARED_SECRET
  model: ""
  messages_per_person_per_hour: 12   # the message limit. There is deliberately no spend cap
  person_gap_s: 5
  reply_max_chars: 300
  elaborate_max_chars: 700
  max_tokens: 100
  elaborate_max_tokens: 200
  timeout_s: 5.0
  # alert_tokens_per_day: 200000  # optional heads-up to the organizer channel, never stops anything

rewards:
  announced: false               # while false the duck never mentions rewards or prizes

schedule:
  timezone: UTC                  # e.g. Europe/Berlin (needs the tzdata package)
  launch_date: null              # "2026-10-26"
  end_date: null                 # set by the owner; default is launch + program_weeks
  program_weeks: 13

safety:
  distress_words: []             # extra words; the built-in draft list in goose/core/wordlists.py always applies
  sad_words: []
  contact_text: "Please talk to a trusted adult, or ask one of the organizers for help."

paths:
  db: data/goose.db
  audit: data/audit.log
  lines: config/lines.yaml
