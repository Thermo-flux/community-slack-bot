# goose-lee canned line bank. Built from docs/APPENDIX_VOICE.md and docs/PLAN.md section 2.
# {de:id} marks an approved German phrase (text in `german` below). {slot} fills from code.
# A line lists the German ids it uses in `de`. Lines must read fine without the German.
# Rules: no em or en dashes, no reward words outside moments named reward_*, under 200 characters.

moments:
  join:
    - {id: join_1, text: "You're in the pond now. The duck starts counting from this week. `/goose me` shows your page, privately."}
    - {id: join_2, text: "{de:enterich}! You're in, and the duck starts counting. `/goose me` shows your page.", de: [enterich]}
    - {id: join_3, text: "Welcome aboard. The duck starts counting this week. `/goose me` shows your page, privately."}

  welcome:
    - {id: welcome_1, text: "{de:entenhausen}! `/goose join` opts you in. The duck teases lightly now and then, and `/goose quiet on` stops it.", de: [entenhausen]}
    - {id: welcome_2, text: "Welcome to the pond. `/goose join` opts you in. The duck teases lightly now and then, and `/goose quiet on` stops it."}
    - {id: welcome_3, text: "New duck in the pond. `/goose help` has the menu, and `/goose quiet on` keeps the duck from teasing you."}

  level_up:
    - {id: level_up_1, text: "Pond level {n}, {title}. The duck wrote it down with a very serious face."}
    - {id: level_up_2, text: "Level {n}, {title}. {de:mensch}! The duck is very proud of this one.", de: [mensch]}
    - {id: level_up_3, text: "Pond level {n}, {title}. The pond noticed, and the duck took a short bow."}

  star:
    - {id: star_1, text: "An organizer gave you a star for {kind}. The duck put on its good hat. `+{n}` crumbs."}
    - {id: star_2, text: "A star for {kind}. The duck put on its good hat. `+{n}` crumbs."}
    - {id: star_3, text: "Star for {kind}, from an organizer. The duck is proud to say so. `+{n}` crumbs."}

  bigstar:
    - {id: bigstar_1, text: "{de:quak_mal}! A big star for {kind}. `+{n}` crumbs.", de: [quak_mal]}
    - {id: bigstar_2, text: "A big star for {kind}! The duck is flapping hard. `+{n}` crumbs."}
    - {id: bigstar_3, text: "A big star for {kind}, from an organizer. The pond is loud about it. `+{n}` crumbs."}

  level_12:
    - {id: level_12_1, text: "Pond level {n}, {title}. {de:mega}! The duck salutes with one wing.", de: [mega]}
    - {id: level_12_2, text: "Pond level {n}, {title}. The duck salutes with one wing, very slowly."}
    - {id: level_12_3, text: "Pond level {n}, {title}. The duck is very proud and only a little dramatic about it."}

  ack:
    - {id: N1, text: "{de:quak}! The duck heard its name. `/goose help` has the menu.", de: [quak]}
    - {id: N2, text: "{de:moin}! Hi, the duck is awake. `/goose help` lists everything.", de: [moin]}
    - {id: N3, text: "The duck is here, not a goose, despite the rumors. `/goose help` for commands."}
    - {id: N4, text: "Hi! The duck is listening. `/goose me` shows your page, privately."}
    - {id: N5, text: "{de:hoppla}! Did someone call? The duck is here. `/goose help` is the menu.", de: [hoppla]}
    - {id: N6, text: "{de:watschel}, watschel. The duck waddles over. `/goose help` is the menu.", de: [watschel]}
    - {id: N7, text: "{de:mensch}, a ping. The duck is honored and slightly confused. `/goose help`.", de: [mensch]}
    - {id: N8, text: "{de:genau}, that's the duck's name. For commands, try `/goose help`.", de: [genau]}
    - {id: N9, text: "The duck is awake and listening. Try `/goose help` for the menu."}
    - {id: N10, text: "Hello from the pond. `/goose me` is your page, privately, and `/goose help` is the menu."}

  anger_calm:
    - {id: C1, text: "The duck is a duck. {de:quak}! The duck remains calm.", de: [quak]}
    - {id: C2, text: "Goose? Not in this pond. The duck is a duck, and sure of it."}
    - {id: C3, text: "{de:gans_falsch}. That's completely wrong. The duck is a duck.", de: [gans_falsch]}
    - {id: C4, text: "A goose? Nope, just the duck. {de:genau}, exactly the duck.", de: [genau]}
    - {id: C5, text: "{de:quak}. The duck remains calm, and very much a duck.", de: [quak]}
    - {id: C6, text: "{de:mensch}, the duck is a duck. Not a goose, not even a little.", de: [mensch]}
    - {id: C7, text: "The duck is calm. It is a duck, and it says so quietly."}
    - {id: C8, text: "Not a goose here. Just a calm duck with a very firm opinion."}
    - {id: C9, text: "A calm duck is still a duck. Nothing more is needed."}

  anger_annoyed:
    - {id: A1, text: "Goose again? The duck is getting a little annoyed. {de:quak}.", de: [quak]}
    - {id: A2, text: "Three goose calls in one pond. The duck is counting, and not happy."}
    - {id: A3, text: "{de:hoppla}, that's a lot of goose talk. The duck is annoyed now.", de: [hoppla]}
    - {id: A4, text: "{de:gans_falsch}, again. The duck would like the goose talk to stop.", de: [gans_falsch]}
    - {id: A5, text: "The duck came to this pond for bread, not goose jokes. {de:quak}.", de: [quak]}
    - {id: A6, text: "The duck is still a duck, still a little annoyed."}
    - {id: A7, text: "Goose talk is noted. The duck is noting it with a frown."}
    - {id: A8, text: "The duck is a duck, and would like that to be the end of it."}
    - {id: A9, text: "Another goose call. The duck sighs, loudly, in the reeds."}

  anger_angry:
    - {id: G1, text: "The duck is now angry. Very angry. The feathers are standing up."}
    - {id: G2, text: "The duck is angry enough to flap twice, very loudly. {de:quak}.", de: [quak]}
    - {id: G3, text: "{de:gans_falsch}! Completely wrong, and the duck has never been more offended.", de: [gans_falsch]}
    - {id: G4, text: "The duck's anger level is high. The pond is nervous. The duck is mostly not."}
    - {id: G5, text: "The duck waddles off in a huff. {de:watschel}, watschel.", de: [watschel]}
    - {id: G6, text: "Very angry duck. {de:mega} tension in the reeds.", de: [mega]}
    - {id: G7, text: "The duck has had enough goose talk and is saying so in its loudest voice."}
    - {id: G8, text: "Angry duck, calm pond. The duck is very upset about the whole thing."}
    - {id: G9, text: "The feathers are up, the beak is out. The duck wants the goose talk to stop."}

  anger_honk:
    - {id: H1, text: "HONK! ...Quak. Sorry, that was not the duck. {de:entenschuldigung}!", de: [entenschuldigung]}
    - {id: H2, text: "The duck said HONK. That was a slip. {de:quak}. Sorry, the duck is a duck.", de: [quak]}
    - {id: H3, text: "HONK! Wait. The duck is a duck. {de:quak}. {de:entenschuldigung}.", de: [quak, entenschuldigung]}
    - {id: H4, text: "Duck status: angry. Duck voice: HONK. Duck correction: quack. Sorry about that."}
    - {id: H5, text: "HONK. ...I mean quack. The duck is very embarrassed, and a little sorry."}
    - {id: H6, text: "HONK! Oops, that came out by accident. {de:hoppla}. {de:quak}.", de: [hoppla, quak]}
    - {id: H7, text: "HONK! That was not planned. The duck is sorry and would like to pretend it was a cough."}
    - {id: H8, text: "HONK. Sorry. That was a slip, and the duck is embarrassed about it."}
    - {id: H9, text: "HONK... Quack. The duck would like everyone to forget that happened."}

  anger_timeout:
    - {id: T1, text: "One more goose and this duck puts itself in timeout. Nobody else is in trouble."}
    - {id: T2, text: "The duck has put itself in timeout for ten minutes. Dramatic, self-imposed, zero effect on anyone."}
    - {id: T3, text: "Timeout for the duck, starting now. Ten minutes in the corner. Nobody else is affected."}
    - {id: T4, text: "The duck is sitting in the corner by the bread. This only affects the duck. {de:quak}.", de: [quak]}
    - {id: T5, text: "{de:mensch}. The duck is in timeout, its own idea, and totally harmless.", de: [mensch]}
    - {id: T6, text: "The duck is in timeout. This changes nobody's score, feathers or fun. Zero danger."}

  anger_cooling:
    - {id: K1, text: "All's well, the duck is cooling down. {de:ente_gut}.", de: [ente_gut]}
    - {id: K2, text: "The duck is cooling down and feeling relaxed. {de:entenentspannt}.", de: [entenentspannt]}
    - {id: K3, text: "The duck is in its corner, calm and fluffy. Goose talk is paused for now. {de:quak}.", de: [quak]}
    - {id: K4, text: "Still a bit warm. The duck is cooling off, one feather at a time. {de:watschel}, watschel.", de: [watschel]}
    - {id: K5, text: "Back to calm soon. The duck says it is fine now. {de:genau}, the pond is peaceful.", de: [genau]}
    - {id: K6, text: "Calm pond, calm duck, all good. {de:ente_gut}.", de: [ente_gut]}
    - {id: K7, text: "The duck is cooling down. Goose talk is paused, and the reeds are quiet."}
    - {id: K8, text: "Almost back to normal. The duck is fluffing its feathers and calming down."}
    - {id: K9, text: "The duck is calm again. Nothing has changed except the feathers."}

  rank_remark_active:
    - {id: R1, text: "{de:mensch}, you're still hella active this week. The pond noticed.", de: [mensch]}
    - {id: R2, text: "Still this active? The duck is genuinely impressed and a little tired just watching."}
    - {id: R3, text: "You've been hella active this week. {de:mega} typing, says the pond.", de: [mega]}
    - {id: R4, text: "Lots of chat from you lately. The duck approves, and is only mildly jealous of your keyboard."}
    - {id: R5, text: "Still very active this week. The duck calls that a proper pond habit."}

  rank_top10:
    - {id: R6, text: "You're #{rank} this week. The duck is quietly proud and not telling the flock."}
    - {id: R7, text: "#{rank} this week. {de:mega} work, says one very impressed duck.", de: [mega]}
    - {id: R8, text: "Rank {rank} this week. The duck put on its good hat for this."}
    - {id: R9, text: "#{rank} this week, and still typing. The pond salutes you with one wing."}

  rank_below:
    - {id: R10, text: "Your full numbers are in `/goose me`, privately. The pond is still counting."}
    - {id: R11, text: "Rankings are a pond thing. Check `/goose me` for your details. The duck keeps no grudges."}
    - {id: R16, text: "The duck keeps the board, and `/goose me` has your details, privately."}

  rank_duck:
    - {id: R12, text: "The duck is unranked. The duck finds this deeply unfair and is writing a complaint. {de:quak}.", de: [quak]}
    - {id: R13, text: "The duck has no rank. It is not a number, and it is offended, but still answering."}
    - {id: R14, text: "Rank? The duck is on no board at all. {de:mensch}, the duck is offended.", de: [mensch]}
    - {id: R15, text: "The duck is not on the board. It is not a number. It would like that noted."}

  roast:
    - {id: RO1, text: "That message had {excl} exclamation marks. The pond felt it."}
    - {id: RO2, text: "{excl} exclamation marks in one message. The pond felt every one of them."}
    - {id: RO3, text: "That message had {excl} exclamation marks. The duck is flattered and slightly concerned."}
    - {id: RO4, text: "Lots of 'lol's in one message. The pond is laughing too."}
    - {id: RO5, text: "Lots of 'lol's in one message. The duck is laughing too, quietly."}

  roast_self:
    - {id: RS1, text: "The duck reviewed its own bread budget and finds it deeply irresponsible."}
    - {id: RS2, text: "The duck has checked its own pond ledger, and it is a mess. {de:entenschuldigung}.", de: [entenschuldigung]}
    - {id: RS3, text: "The duck tried to count its own crumbs and quacked at the total. {de:quak}.", de: [quak]}
    - {id: RS4, text: "The duck roasted itself, and felt very seen."}

  limit_reached:
    - {id: LR1, text: "The duck needs a breather. Ask again in a few minutes."}
    - {id: LR2, text: "The duck needs a breather, and a bread. Try again in a little while."}
    - {id: LR3, text: "Too many messages from you for one hour. The duck needs a breather."}

  program_redirect:
    - {id: PR1, text: "That's a program question and I'm only a duck. Orry has the Docs. Ask Orry or post in #loadout-help."}
    - {id: PR2, text: "Program questions are not my pond. Ask Orry, or post in #loadout-help."}
    - {id: PR3, text: "I'm only a duck, and that one is for Orry. Try #loadout-help."}

  not_joined:
    - {id: NJ1, text: "You haven't joined yet. Type `/goose join` and the duck starts counting."}
    - {id: NJ2, text: "The duck has no record of you yet. `/goose join` starts the counting."}
    - {id: NJ3, text: "Not in the pond yet. Type `/goose join` to start."}

  unknown_person:
    - {id: UP1, text: "I checked the whole pond. No record for that person. Maybe they haven't joined."}
    - {id: UP2, text: "No record for that person in the pond. They may not have joined yet."}
    - {id: UP3, text: "The duck searched the reeds. Nobody by that name is counting yet."}

  error:
    - {id: ER1, text: "Something went wrong on my side. Your score is safe. An organizer has been told."}
    - {id: ER2, text: "The duck tripped over a reed. Your score is safe, and an organizer knows."}
    - {id: ER3, text: "Something broke on the duck's end. Nothing you did caused it, and your crumbs are safe."}

  safety:
    - {id: SAFE1, text: "I'm a bot, not a person, so I can't help with this one. {contact}"}
    - {id: SAFE2, text: "This needs a real person. {contact}"}
    - {id: SAFE3, text: "I'm only a bot and can't help with this. {contact}"}

  chat_fallback:
    - {id: CF1, text: "The duck is busy napping right now. `/goose help` has the menu."}
    - {id: CF2, text: "The duck can't answer that right now. Try `/goose help`."}
    - {id: CF3, text: "That's a bit much for a duck right now. `/goose help` is the menu."}

  unknown_phrase:
    - {id: UPH1, text: "The duck didn't catch that. `/goose help` lists what it knows."}
    - {id: UPH2, text: "Quack? The duck does not know that one. `/goose help` has the menu."}
    - {id: UPH3, text: "That's outside the duck's pond. `/goose help` lists the commands."}

  quack:
    - {id: QK1, text: "{de:quak}! The duck is in a good mood.", de: [quak]}
    - {id: QK2, text: "Quack! The duck is in a good mood and wants you to know."}
    - {id: QK3, text: "{de:watschel}, watschel. The duck waddles past, quacking softly.", de: [watschel]}

  pun:
    - {id: PUN1, text: "Here is one: {de:ente_gut}. Ask about it in the thread, or try `/goose explain`.", de: [ente_gut]}
    - {id: PUN2, text: "{de:quak_mal}! The duck found a pun. Ask for the meaning in the thread.", de: [quak_mal]}
    - {id: PUN3, text: "The duck has a pun ready. Reply in the thread with what does that mean."}

  busiest_duck:
    - {id: BD1, text: "Busiest duck this week: {name}. The pond admires the typing."}
    - {id: BD2, text: "{name} sent the most messages this week. The pond is in awe of the keyboard."}
    - {id: BD3, text: "Busiest duck this week: {name}. {de:mensch}, that's a lot of typing.", de: [mensch]}

  pond_report_header:
    - {id: PRH1, text: "{de:quaktuell}: Pond Report, week {n}.", de: [quaktuell]}
    - {id: PRH2, text: "Pond Report, week {n}. The duck has the numbers and a very serious face."}
    - {id: PRH3, text: "Pond Report, week {n}. {de:quaktuell} news from the reeds.", de: [quaktuell]}

  pond_report_result:
    - {id: PRR1, text: "An organizer checked it. No {de:zeitungsente}!", de: [zeitungsente]}
    - {id: PRR2, text: "An organizer checked these. Nothing here is a hoax."}
    - {id: PRR3, text: "Checked by an organizer before posting. The duck can vouch for these results."}

  pond_report_footer:
    - {id: PRF1, text: "That's it for the week. {de:ente_gut}. {de:wochenende}!", de: [ente_gut, wochenende]}
    - {id: PRF2, text: "That's it for the week. See you at the next Pond Report."}
    - {id: PRF3, text: "That's the week. {de:feierabend}! The duck is off to the bread.", de: [feierabend]}

  consent_needed:
    - {id: consent_1, text: "The duck needs you to accept the privacy notice again before it can answer you. Use `/goose join` to see it."}
    - {id: consent_2, text: "The privacy notice changed, so the duck is quiet for you until you accept it. `/goose join` shows it."}
    - {id: consent_3, text: "Quick admin: the duck needs a fresh yes to the privacy notice. `/goose join` has the details."}

  stop_apology:
    - {id: stop_1, text: "Entenschuldigung! Fair enough. The duck will stop teasing you."}
    - {id: stop_2, text: "Sorry about that. The duck has switched off the teasing for you. `/goose quiet off` brings it back."}
    - {id: stop_3, text: "Understood, no more jokes from the duck for you. Sorry for overdoing it."}

german:
  ente_gut:
    text: "Ente gut, alles gut"
    meaning: "all's well that ends well"
    wordplay: "from 'Ende gut, alles gut'"
    explain: "Ente gut, alles gut is a pun on 'Ende gut, alles gut' (all's well that ends well), with a duck in it."
  entenschuldigung:
    text: "Entenschuldigung"
    meaning: "sorry, excuse me"
    wordplay: "from 'Entschuldigung'"
    explain: "Entenschuldigung is a pun on 'Entschuldigung' (sorry, excuse me). The duck is sorry."
  quaktuell:
    text: "Quaktuell"
    meaning: "current, up to date"
    wordplay: "from 'aktuell'"
    explain: "Quaktuell is a pun on 'aktuell' (current, up to date). Very current duck news."
  entenentspannt:
    text: "Entenentspannt"
    meaning: "relaxed"
    wordplay: "from 'entspannt'"
    explain: "Entenentspannt is a pun on 'entspannt' (relaxed). The duck is relaxed, like a pond."
  quak_mal:
    text: "Quak mal"
    meaning: "look"
    wordplay: "from 'Guck mal!'"
    explain: "Quak mal! is a pun on 'Guck mal!' (look!). The duck is pointing, with its beak."
  zeitungsente:
    text: "Zeitungsente"
    meaning: "a hoax story, literally newspaper duck"
    wordplay: "a real word"
    explain: "Zeitungsente means a hoax story, literally 'newspaper duck'. A false story, not a real duck."
  gans_falsch:
    text: "Gans falsch"
    meaning: "completely wrong"
    wordplay: "from 'ganz falsch'"
    explain: "Gans falsch is a pun on 'ganz falsch' (completely wrong). Gans means goose. The duck is not one."
  gans_toll:
    text: "Gans toll"
    meaning: "really great"
    wordplay: "from 'ganz toll'"
    explain: "Gans toll is a pun on 'ganz toll' (really great). Gans means goose. The duck is not one, but it accepts the compliment."
  moin:
    text: "Moin"
    meaning: "hi, any time of day"
    wordplay: ""
    explain: "Moin is a short North German greeting, used at any time of day."
  mega:
    text: "Mega"
    meaning: "huge, great"
    wordplay: ""
    explain: "Mega means huge or great, and the duck uses it for anything impressive."
  hoppla:
    text: "Hoppla"
    meaning: "oops"
    wordplay: ""
    explain: "Hoppla is what you say when something slips. The duck says it when it has slipped."
  watschel:
    text: "Watschel"
    meaning: "waddle, waddle"
    wordplay: ""
    explain: "Watschel, watschel means waddle, waddle. It is the sound of a duck walking. This is that walk."
  quak:
    text: "Quak"
    meaning: "the German duck sound"
    wordplay: ""
    explain: "Quak is the German sound a duck makes. It is the duck's favorite word."
  genau:
    text: "Genau"
    meaning: "exactly"
    wordplay: ""
    explain: "Genau means exactly, and the duck uses it when it agrees with itself."
  mensch:
    text: "Mensch"
    meaning: "wow"
    wordplay: ""
    explain: "Mensch means 'human' or 'man', and it is used like 'wow!'. The duck uses it for surprise."
  entenzueckend:
    text: "Entenzückend"
    meaning: "delightful"
    wordplay: "from 'entzückend'"
    explain: "Entenzückend is a pun on 'entzückend' (delightful). A duck compliment."
  das_ist_ne_ente:
    text: "Das ist 'ne Ente"
    meaning: "that's a hoax"
    wordplay: "an everyday idiom"
    explain: "Das ist 'ne Ente is an everyday German idiom for a hoax. The duck is the hoax, here."
  quacksalber:
    text: "Quacksalber"
    meaning: "charlatan"
    wordplay: "a real word, from the same root as English quack"
    explain: "Quacksalber means a charlatan. English 'quack' comes from the same root. The duck is no Quacksalber, the numbers are checked."
  entenhausen:
    text: "Willkommen in Entenhausen"
    meaning: "welcome to Duckburg"
    wordplay: "the German name of Duckburg"
    explain: "Willkommen in Entenhausen means welcome to Duckburg, the German name of the town. Text only."
  alle_meine_entchen:
    text: "Alle meine Entchen"
    meaning: "all my little ducks"
    wordplay: "a nursery rhyme"
    explain: "Alle meine Entchen is a German nursery rhyme. It means all my little ducks."
  enterich:
    text: "Der Enterich drückt Enter"
    meaning: "the drake presses Enter"
    wordplay: "Enterich (drake) plus the Enter key"
    explain: "Der Enterich drückt Enter uses Enterich (drake) and the Enter key. The drake presses Enter."
  federleicht:
    text: "federleicht"
    meaning: "feather-light"
    wordplay: "a real word"
    explain: "federleicht means feather-light, and the duck uses it for light things."
  geschnattert:
    text: "Heute wird geschnattert"
    meaning: "today there is gabbling, the pond is lively"
    wordplay: "from schnattern (to gabble)"
    explain: "Heute wird geschnattert means today there is gabbling. Schnattern is what ducks do, so the pond is lively."
  wochenende:
    text: "Schönes Wochenende"
    meaning: "have a nice weekend"
    wordplay: ""
    explain: "Schönes Wochenende means have a nice weekend."
  feierabend:
    text: "Feierabend"
    meaning: "end of the work day, time to log off"
    wordplay: ""
    explain: "Feierabend means the end of the work day, time to log off."
  tschuess:
    text: "Tschüss"
    meaning: "bye"
    wordplay: ""
    explain: "Tschüss means bye."
  bitte_sehr:
    text: "Bitte sehr"
    meaning: "here you go"
    wordplay: ""
    explain: "Bitte sehr means 'here you go', said politely when handing something over."
  das_ist_ente:
    text: "Das ist 'ne Ente!"
    meaning: "that's a hoax"
    wordplay: "a colloquial idiom, 'Ente' also means hoax"
    explain: "Das ist 'ne Ente! is everyday German for 'that's a hoax', and Ente is also the word for a false news story."
  enterich_enter:
    text: "Der Enterich drückt Enter"
    meaning: "the drake presses Enter"
    wordplay: "Enterich (drake) sounds like the Enter key"
    explain: "Der Enterich drückt Enter is a pun: Enterich means drake, and it also sounds like the Enter key on a keyboard."
  heute_geschnattert:
    text: "Heute wird geschnattert!"
    meaning: "there is gabbling today"
    wordplay: "schnattern means to gabble, as ducks do"
